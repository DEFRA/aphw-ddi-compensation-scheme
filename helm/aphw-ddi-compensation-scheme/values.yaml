environment: production
environmentCode:
name: aphw-ddi-compensation-scheme
namespace: aphw-ddi
workstream: aphw-ddi
image: aphw-ddi-compensation-scheme

labels:
  component: service

appInsights:
  connectionString:

containerConfigMap:
  name: aphw-ddi-compensation-scheme

containerSecret:
  name: aphw-ddi-compensation-scheme

deployment: {}

container:
  requestMemory: 100Mi
  requestCpu: 100m
  limitMemory: 100Mi
  limitCpu: 100m
  port: 3000
  cookiePassword: cookiecookiecookiecookiecookiecookie
  redisHostname: redis-hostname.default
  redisPartition: aphw-ddi-compensation-scheme
  redisPort: 6379
  azureStorageUseConnectionString: false
  azureStorageAccountName: dummy

livenessProbe:
  path: /healthz
  port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  path: /healthy
  port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

workloadIdentity: true

azureIdentity:
  clientID: not-a-real-clientID
  resourceID: not-a-real-resourceID

secretProviderClass:
  azure:
    keyvaultName: SNDFFCINFKV2001
    objects:
      - objectName: snd2-aphw-appinsights-connectionString
        objectType: secret
      - objectName: snd2-redisPassword
        objectType: secret
  secretObjects:
    - secretName: aphw-ddi-compensation-scheme
      type: Opaque
      data:
        - objectName: snd2-aphw-appinsights-connectionString
          key: APPINSIGHTS_CONNECTIONSTRING
        - objectName: snd2-redisPassword
          key: REDIS_PASSWORD
